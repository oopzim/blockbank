<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>BlockBank · ธนาคารกลางบล็อก</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f8a5f"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BlockBank">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f3f6f4;--card:#fff;--tx:#14231b;--mu:#66766d;--ac:#0f8a5f;--ac2:#0b6b4a;--bd:#dde6e1;--rd:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#0e1612;--card:#17221c;--tx:#e8f2ec;--mu:#8fa398;--ac:#2fbf8a;--ac2:#1f9a6c;--bd:#26362d;--rd:#fb923c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;max-width:520px;margin:0 auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:18px;padding:20px}.hero small{opacity:.85}.bal{font-size:38px;font-weight:700;margin:4px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-top:12px}h3{margin:0 0 10px;font-size:15px}
input,select,button{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:8px}
button{background:var(--ac);color:#fff;border:0;font-weight:600;cursor:pointer}button.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.mu{color:var(--mu);font-size:12px}.in{color:var(--ac)}.out{color:var(--rd)}
.tabs{display:flex;gap:6px;margin-top:12px}.tabs button{margin:0;padding:9px 2px;font-size:12px;background:var(--card);color:var(--tx);border:1px solid var(--bd)}.tabs button.on{background:var(--ac);color:#fff}
.sw{display:flex;gap:6px;margin-top:10px}.sw button{margin:0;padding:8px;font-size:13px;background:rgba(255,255,255,.2)}.sw button.on{background:#fff;color:#0b6b4a}
#qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px;margin-top:8px}#qr img{max-width:100%}
video{width:100%;border-radius:12px;margin-top:8px}#msg{margin-top:8px;font-size:13px;min-height:18px}
#toast{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:480px;background:var(--ac2);color:#fff;padding:12px 14px;border-radius:12px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.35);font-size:14px;cursor:pointer}
</style></head><body>
<div id="app">กำลังโหลด…</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,collection,onSnapshot,getDoc,setDoc,writeBatch,deleteDoc,query,orderBy,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ===== 1) ใส่ค่าจาก Firebase Console (Project settings > Your apps > Web) ===== */
const firebaseConfig={apiKey:"AIzaSyCaHHR9mQ3QmGbWEuytph_qpvd8KxOyAbM",authDomain:"blockbank-d14e6.firebaseapp.com",projectId:"blockbank-d14e6",storageBucket:"blockbank-d14e6.firebasestorage.app",messagingSenderId:"54481235501",appId:"1:54481235501:web:0f603fb09a46d6a07812a4"};
/* ===== 2) อีเมล Google ของเจ้าของธนาคารกลาง (ต้องตรงกับใน firestore.rules) ===== */
const OWNER_EMAIL="waveqezxc@gmail.com";
const SUPPLY=100000;
const PRICES=[["Cobblestone / หินกลม",1,1000],["Coal / ถ่าน",2,500],["Copper Ingot / ทองแดง",2,500],["Redstone / เรดสโตน",3,400],["Lapis / ลาพิส",4,300],["Iron Ingot / เหล็ก",8,200],["Gold Ingot / ทอง",15,150],["Emerald / มรกต",30,100],["Diamond / เพชร",100,50],["Shulker Shell / เปลือกชัลเกอร์",150,20],["Netherite Scrap / เศษเนเธอไรต์",200,15],["Trident / ตรีศูล",500,10],["Golden Apple (Ench.) / แอปเปิลทองเวทมนตร์",600,10],["Totem of Undying / โทเทม",800,10],["Netherite Ingot / แท่งเนเธอไรต์",900,8],["Elytra / ปีก",1500,3],["Beacon / บีคอน",1500,3]];

// ราคาขาย = ราคากลาง x clamp((เป้าหมาย/ของในคลัง)^ความไว, ต่ำสุด, สูงสุด)  (ต้องตรงกับ firestore.rules)
const px=(b,t,q,lo,hi,e)=>Math.max(1,Math.round(b*Math.min(hi,Math.max(lo,Math.pow(t/Math.max(q,1),e)))));
const pr=s=>px(s.b,s.t,s.q,s.lo??0.5,s.hi??3,s.e??0.5);
const nameOf=(id,s)=>s.name||(PRICES[+id]?PRICES[+id][0]:'ไอเทม');
const items=()=>Object.entries(stock).map(([id,s])=>({...s,id,name:nameOf(id,s)})).sort((x,y)=>(x.o??(+x.id||0))-(y.o??(+y.id||0)));
const curveFields=(p,v)=>`<div class="mu" style="margin-top:6px">ราคาต่ำสุด (เท่าของราคากลาง)</div><input id="${p}_lo" type="number" step="0.05" min="0.05" max="1" value="${v.lo}"><div class="mu">ราคาสูงสุด (เท่าของราคากลาง)</div><input id="${p}_hi" type="number" step="0.5" min="1" max="20" value="${v.hi}"><div class="mu">ความไวของราคา (0.2 นิ่ง · 0.5 ปกติ · 1 ขึ้นลงแรง)</div><input id="${p}_e" type="number" step="0.1" min="0.1" max="3" value="${v.e}">`;
const openIds=new Set();let pendingRender=false;
const bankBuy=p=>Math.max(1,Math.round(p*0.8));
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let me=null,acts={},txs=[],mints=[],stock={},acting='me',tab='home',preTo=new URLSearchParams(location.search).get('to'),stream=null,scanning=false,started=false;
const $=s=>document.querySelector(s),fmt=n=>(n||0).toLocaleString('th-TH');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const issued=()=>acts.central?SUPPLY+mints.reduce((a,m)=>a+(m.a||0),0):0;
const isOwner=()=>me&&me.email===OWNER_EMAIL;
const curId=()=>acting==='central'?'central':me.uid;
const nm=id=>id==='central'?'🏦 ธนาคารกลาง':(id===me.uid?'ฉัน':(acts[id]?.name||'สมาชิก'));
const payUrl=id=>location.origin+location.pathname+'?to='+id;

getRedirectResult(auth).catch(e=>showErr(e));
onAuthStateChanged(auth,async u=>{
  me=u;if(!u){login();return}
  try{
    const ref=doc(db,'users',u.uid);
    if(!(await getDoc(ref)).exists())await setDoc(ref,{name:u.displayName||u.email.split('@')[0],bal:0,at:serverTimestamp()});
  }catch(e){showErr(e);return}
  setTimeout(()=>{if(!loaded)showErr({code:'permission-denied',message:'โหลดข้อมูลไม่สำเร็จ'})},10000);
  if(!started){started=true;
    onSnapshot(collection(db,'users'),s=>{loaded=true;acts={};s.docs.forEach(d=>acts[d.id]=d.data());softRender()},e=>showErr(e));
    onSnapshot(query(collection(db,'tx'),orderBy('t','desc'),limit(100)),s=>{txs=s.docs.map(d=>d.data());checkNotify();softRender()});
    onSnapshot(collection(db,'mints'),s=>{mints=s.docs.map(d=>d.data());softRender()});
    onSnapshot(collection(db,'stock'),s=>{stock={};s.docs.forEach(d=>stock[d.id]=d.data());softRender()});
  }
});

/* ===== ระบบแจ้งเตือน ===== */
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,String(v))}catch(e){}}};
let initialDone=false,loaded=false;const told=new Set();
const tsOf=x=>x.t?x.t.seconds:0;
const fromSelf=x=>x.f===me.uid||(x.f==='central'&&isOwner());
const forMe=x=>!fromSelf(x)&&(x.to===me.uid||(isOwner()&&x.to==='central'));
const seenKey=()=>'bb_seen_'+me.uid;
const unread=()=>{if(!me||LS.get(seenKey())===null)return 0;const seen=+LS.get(seenKey());return txs.filter(x=>forMe(x)&&tsOf(x)>seen).length};
function markSeen(){if(me&&txs.length)LS.set(seenKey(),Math.max(+LS.get(seenKey())||0,...txs.map(tsOf)))}
const msgOf=x=>x.to==='central'&&(x.n||'').startsWith('ซื้อ:')?`🛒 ${nm(x.f)} ${x.n} (+${fmt(x.a)} เหรียญ)`:`🪙 ได้รับ ${fmt(x.a)} เหรียญ จาก ${nm(x.f)}${x.n?' · '+x.n:''}`;
function toast(t){const d=document.createElement('div');d.id='toast';d.textContent=t;d.onclick=()=>{d.remove();tb('hist')};document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
function sysNotify(t){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const o={body:t,icon:'icon-192.png',badge:'icon-192.png',tag:'bb',renotify:true,vibrate:[200,100,200]};
  const fb=()=>{try{new Notification('BlockBank',o)}catch(e){}};
  if(navigator.serviceWorker)navigator.serviceWorker.ready.then(r=>r.showNotification('BlockBank',o)).catch(fb);else fb();
}
function checkNotify(){
  if(!me)return;
  if(LS.get(seenKey())===null){LS.set(seenKey(),Math.max(0,...txs.map(tsOf)));initialDone=true;return}
  const seen=+LS.get(seenKey());
  txs.filter(x=>forMe(x)&&tsOf(x)>seen).reverse().forEach(x=>{
    const id=tsOf(x)+x.f+x.a;if(told.has(id))return;told.add(id);
    if(initialDone){const t=msgOf(x);toast(t);if(document.hidden)sysNotify(t)}
  });
  if(!initialDone){initialDone=true;const u=unread();if(u)toast(`📬 มีรายการเข้าใหม่ ${u} รายการตั้งแต่ครั้งก่อน`)}
  if(tab==='hist')markSeen();
}
function notifCard(){
  if(!('Notification' in window))return '';
  if(Notification.permission==='default')return `<div class="card"><h3>🔔 แจ้งเตือน</h3><div class="mu">รับแจ้งเตือนเมื่อมีคนโอนเหรียญให้${isOwner()?' หรือมีคนซื้อของ':''}</div><button onclick="askNotif()">เปิดการแจ้งเตือน</button></div>`;
  if(Notification.permission==='denied')return `<div class="card mu">🔕 การแจ้งเตือนถูกปิดไว้ เปิดได้ที่การตั้งค่าเบราว์เซอร์หรือแอพ → การแจ้งเตือน</div>`;
  return '';
}
window.askNotif=async()=>{try{await Notification.requestPermission()}catch(e){}render()};
function hint(e){
  const c=(e&&e.code)||'',m=(e&&e.message)||String(e);
  if(c==='permission-denied'||/permission|insufficient/i.test(m))return 'กฎ Firestore ยังไม่ถูกต้องหรือยังไม่ได้ Publish — ไปที่ Firebase → Firestore → Rules ตรวจว่าขึ้น Published และไม่มี error แดง';
  if(c==='auth/unauthorized-domain')return 'ต้องเพิ่มโดเมน '+location.hostname+' ที่ Firebase → Authentication → Settings → Authorized domains';
  if(c==='auth/operation-not-allowed')return 'ยังไม่ได้เปิด Google ที่ Authentication → Sign-in method';
  if(c==='auth/popup-blocked'||c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return 'หน้าต่างล็อกอินถูกบล็อกหรือถูกปิด ลองปุ่ม "เข้าสู่ระบบแบบเปลี่ยนหน้า"';
  if(c==='auth/network-request-failed')return 'อินเทอร์เน็ตมีปัญหา ลองใหม่';
  return '';
}
function showErr(e){
  const h=hint(e);
  $('#app').innerHTML=`<div class="card"><h3>❌ เกิดข้อผิดพลาด</h3><div style="font-size:13px;word-break:break-word">${esc((e&&(e.code||''))+' '+((e&&e.message)||e))}</div>${h?`<div style="margin-top:8px;font-size:14px">💡 ${esc(h)}</div>`:''}<button onclick="location.reload()">ลองใหม่</button><button class="alt" onclick="signOutNow()">ออกจากระบบ</button></div>`;
}
function login(){$('#app').innerHTML=`<div class="hero"><small>BlockBank · ธนาคารกลางบล็อก</small><div class="bal">🪙</div><small>เข้าสู่ระบบเพื่อเริ่มใช้งาน</small></div><div class="card"><button id="gl">เข้าสู่ระบบด้วย Google</button><button id="gr" class="alt">เข้าสู่ระบบแบบเปลี่ยนหน้า (ถ้าปุ่มบนไม่ทำงาน)</button><div id="msg" style="font-size:13px"></div></div>`;
  const fail=e=>{$('#msg').innerHTML=esc((e.code||'')+' '+e.message)+(hint(e)?'<br>💡 '+esc(hint(e)):'')};
  $('#gl').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
  $('#gr').onclick=()=>signInWithRedirect(auth,new GoogleAuthProvider()).catch(fail)}

function softRender(){
  const ae=document.activeElement;
  if(ae&&ae.closest&&ae.closest('#app')&&/^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)){pendingRender=true;return}
  render();
}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{pendingRender=false;softRender()},600)});
function render(){
  if(!me)return;if(tab==='shop'&&acting!=='me')tab='home';
  if(tab==='inv'&&acting!=='central')tab='home';
  const cid=curId(),acc=acts[cid];let h='';
  h+=`<div class="hero"><small>${acting==='central'?'บัญชีธนาคารกลาง':esc(me.displayName||'บัญชีส่วนบุคคล')}</small><div class="bal">🪙 ${acc?fmt(acc.bal):'—'}</div><small>${acting==='central'?'ไอดีธนาคารกลาง':esc(me.email)}</small>`;
  if(isOwner())h+=`<div class="sw"><button class="${acting==='me'?'on':''}" onclick="sw('me')">ไอดีบุคคล</button><button class="${acting==='central'?'on':''}" onclick="sw('central')">ไอดีธนาคารกลาง</button></div>`;
  h+=`</div><div class="tabs">${[['home','โอน'],...(acting==='me'?[['shop','ร้านค้า']]:[['inv','คลัง']]),['recv','QR'],['scan','สแกน'],['hist','ประวัติ'+(unread()?' •'+unread():'')],['mkt','ราคา']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="tb('${k}')">${l}</button>`).join('')}</div>`;
  if(tab!=='scan')stopScan();
  if(isOwner()&&!acts.central)h+=`<div class="card"><h3>เจ้าของระบบ</h3><button onclick="mint()">สร้างธนาคารกลาง + ออกเหรียญ ${fmt(SUPPLY)}</button></div>`;
  if(tab==='home'){
    h+=notifCard();
    const opts=Object.keys(acts).filter(i=>i!==cid).map(i=>`<option value="${i}" ${i===preTo?'selected':''}>${esc(nm(i))}</option>`).join('');
    h+=`<div class="card"><h3>โอนเหรียญ</h3><select id="to"><option value="">เลือกผู้รับ</option>${opts}</select><input id="amt" type="number" min="1" inputmode="numeric" placeholder="จำนวนเหรียญ"><input id="note" maxlength="100" placeholder="หมายเหตุ เช่น ขายเพชร 2 เม็ด"><button onclick="send()">โอน</button><div id="msg"></div></div>`;
    if(acting==='central'&&acts.central)h+=`<div class="card"><h3>ออกเหรียญเพิ่มเข้าธนาคารกลาง</h3><input id="madd" type="number" min="1" inputmode="numeric" placeholder="จำนวนเหรียญที่จะออกเพิ่ม"><input id="mnote" maxlength="100" placeholder="เหตุผล เช่น เพิ่มสภาพคล่อง"><button onclick="mintMore()">ออกเหรียญเพิ่ม</button><div class="mu" style="margin-top:6px">บันทึกถาวรและนับรวมในยอด "ออกทั้งหมด" ที่ทุกคนเห็น</div></div>`;
    h+=`<div class="card mu">เหรียญทั้งระบบ ${fmt(Object.values(acts).reduce((a,b)=>a+(b.bal||0),0))} / ออกทั้งหมด ${fmt(issued())} · สมาชิก ${Object.keys(acts).filter(i=>i!=='central').length} คน${mints.length?` · ออกเพิ่ม ${mints.length} ครั้ง`:''}<br><a href="#" onclick="signOutNow();return false" style="color:var(--mu)">ออกจากระบบ</a></div>`;
  }
  if(tab==='shop'){const L=items();h+=`<div class="card"><h3>🏦 ซื้อของจากธนาคารกลาง</h3><div class="mu" style="margin-bottom:6px">ราคาขึ้นลงตามของในคลัง ยิ่งเหลือน้อยยิ่งแพง · จ่ายแล้วเจ้าของจะส่งของให้ใน Minecraft</div>${L.length?L.map(s=>`<div class="row"><div>${esc(s.name)}<div class="mu">${fmt(pr(s))} เหรียญ/ชิ้น · เหลือ ${fmt(s.q)}</div></div>${s.q>0?`<div style="display:flex;gap:6px;align-items:center"><input id="q_${s.id}" type="number" min="1" max="${s.q}" value="1" style="width:64px;margin:0;padding:8px"><button style="width:auto;margin:0;padding:8px 14px" onclick="buy('${s.id}')">ซื้อ</button></div>`:'<b class="out">หมด</b>'}</div>`).join(''):'<div class="mu">ธนาคารกลางยังไม่มีสินค้า</div>'}<div id="msg"></div></div>`}
  if(tab==='inv'){
    const L=items(),pl=Object.keys(acts).filter(i=>i!=='central').map(i=>`<option value="${i}">${esc(nm(i))}</option>`).join('');
    h+=`<div class="card"><h3>รับซื้อของจากผู้เล่น</h3><select id="bp"><option value="">เลือกผู้เล่น</option>${pl}</select><select id="bi">${L.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><input id="bq" type="number" min="1" inputmode="numeric" placeholder="จำนวนชิ้น"><button onclick="bankBuyIn()">รับซื้อ (จ่ายเหรียญ + เพิ่มสต็อก)</button><div class="mu" style="margin-top:6px">จ่ายที่ 80% ของราคาขายตอนนี้ ของเข้าคลังอัตโนมัติ</div><div id="msg"></div></div>`;
    h+=`<div class="card"><h3>➕ เพิ่มไอเทมใหม่</h3><input id="nn" maxlength="60" placeholder="ชื่อไอเทม เช่น Netherite Sword / ดาบเนเธอไรต์"><input id="nb" type="number" min="1" inputmode="numeric" placeholder="ราคากลาง (เหรียญ/ชิ้น)"><input id="nt" type="number" min="1" inputmode="numeric" placeholder="สต็อกเป้าหมาย (จำนวนที่ราคาเท่าราคากลาง)"><input id="nq" type="number" min="0" inputmode="numeric" placeholder="จำนวนที่มีตอนนี้ (ไม่ใส่ = 0)"><details style="margin-top:8px"><summary class="mu">ตั้งค่าความผันผวนของราคา (ไม่บังคับ)</summary>${curveFields('n',{lo:0.5,hi:3,e:0.5})}</details><button onclick="addItem()">เพิ่มไอเทม</button></div>`;
    h+=`<div class="card"><h3>คลังสินค้า / ตั้งราคา</h3>${L.map(s=>`<details ${openIds.has(s.id)?'open':''} ontoggle="tg('${s.id}',this.open)" style="border-bottom:1px solid var(--bd);padding:8px 0"><summary>${esc(s.name)} <span class="mu">· ${fmt(pr(s))} เหรียญ · เหลือ ${fmt(s.q)}</span></summary><div class="mu" style="margin-top:6px">ชื่อ</div><input id="${s.id}_name" value="${esc(s.name)}" maxlength="60"><div class="mu">จำนวนในคลัง</div><input id="${s.id}_q" type="number" min="0" value="${s.q}"><div class="mu">ราคากลาง</div><input id="${s.id}_b" type="number" min="1" value="${s.b}"><div class="mu">สต็อกเป้าหมาย</div><input id="${s.id}_t" type="number" min="1" value="${s.t}">${curveFields(s.id,{lo:s.lo??0.5,hi:s.hi??3,e:s.e??0.5})}<button onclick="saveItem('${s.id}')">บันทึก</button><button class="alt" onclick="delItem('${s.id}')">ลบไอเทมนี้</button></details>`).join('')}${L.length?'':'<button onclick="initStock()">เติมรายการเริ่มต้น 17 อย่าง</button>'}<div class="mu" style="margin-top:8px">ราคาตอนนี้ = ราคากลาง × (เป้าหมาย ÷ จำนวนในคลัง)^ความไว แล้วจำกัดไว้ระหว่างราคาต่ำสุด–สูงสุด ของมากกว่าเป้าหมายราคาถูกลง ของน้อยกว่าเป้าหมายราคาแพงขึ้น</div></div>`;
  }
  if(tab==='recv')h+=`<div class="card"><h3>QR รับเหรียญของ ${esc(nm(cid)==='ฉัน'?(me.displayName||'ฉัน'):nm(cid))}</h3><div id="qr"></div><div class="mu" style="margin-top:8px">ให้เพื่อนสแกนด้วยแท็บ "สแกน" หรือกล้องมือถือ ก็จะเปิดหน้าโอนพร้อมเลือกชื่อคุณให้เลย</div><button class="alt" onclick="copyLink()">คัดลอกลิงก์รับเหรียญ</button></div>`;
  if(tab==='scan')h+=`<div class="card"><h3>สแกน QR เพื่อโอน</h3><video id="v" playsinline muted></video><div id="msg" class="mu">กำลังเปิดกล้อง…</div></div>`;
  if(tab==='hist'){const mine=txs.filter(x=>x.f===cid||x.to===cid);
    h+=`<div class="card"><h3>ประวัติธุรกรรม</h3>${mine.length?mine.map(x=>{const o=x.f===cid;return `<div class="row"><div>${o?'โอนให้':'รับจาก'} ${esc(nm(o?x.to:x.f))}<div class="mu">${x.t?x.t.toDate().toLocaleString('th-TH'):''}${x.n?' · '+esc(x.n):''}</div></div><b class="${o?'out':'in'}">${o?'−':'+'}${fmt(x.a)}</b></div>`}).join(''):'<div class="mu">ยังไม่มีรายการ</div>'}</div>`}
  if(tab==='mkt'){const L=items();h+=`<div class="card"><h3>ราคาตอนนี้ (เหรียญ/ชิ้น)</h3><div class="row mu"><span>ของ (เหลือในคลัง)</span><span>ธนาคารขาย / รับซื้อ</span></div>${L.length?L.map(s=>`<div class="row"><span>${esc(s.name)} <span class="mu">(${fmt(s.q)})</span></span><b>${fmt(pr(s))} / ${fmt(bankBuy(pr(s)))}</b></div>`).join(''):'<div class="mu">ยังไม่มีสินค้า</div>'}<div class="mu" style="margin-top:8px">ราคาปรับอัตโนมัติตามของในคลัง ของเยอะราคาถูก ของน้อยราคาแพง ธนาคารรับซื้อที่ 80% ของราคาขาย อยากขายของให้ธนาคาร: ส่งของให้เจ้าของใน Minecraft แล้วเจ้าของจะบันทึกและโอนเหรียญให้</div></div>`}
  $('#app').innerHTML=h;
  if(tab==='recv'){new QRCode($('#qr'),{text:payUrl(cid),width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}
  if(tab==='scan')startScan();
}
function stopScan(){scanning=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
async function startScan(){
  const v=$('#v'),m=$('#msg');
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;await v.play();scanning=true;m.textContent='เล็งกล้องไปที่ QR';
    const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
    const loop=()=>{if(!scanning)return;
      if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
        if(r){try{const id=new URL(r.data).searchParams.get('to');if(id&&acts[id]&&id!==curId()){preTo=id;stopScan();tab='home';render();return}}catch(e){}}}
      requestAnimationFrame(loop)};loop();
  }catch(e){m.textContent='เปิดกล้องไม่ได้ (ต้องอนุญาตกล้อง และเปิดผ่าน https)'}
}
window.tb=k=>{tab=k;if(k==='hist')markSeen();render()};window.sw=k=>{acting=k;render()};window.signOutNow=()=>signOut(auth);
window.copyLink=async()=>{await navigator.clipboard.writeText(payUrl(curId()));alert('คัดลอกแล้ว')};
window.mint=async()=>{if(acts.central||!confirm('ออกเหรียญ '+fmt(SUPPLY)+' เข้าธนาคารกลาง? ทำได้ครั้งเดียว'))return;
  try{await setDoc(doc(db,'users','central'),{name:'ธนาคารกลาง',bal:SUPPLY,at:serverTimestamp()})}catch(e){alert('ไม่สำเร็จ: '+e.message)}};
let busy=false;
async function doTransfer(f,to,a,n,m,extra){
  if(busy)return false;busy=true;m.textContent='กำลังดำเนินการ…';let ok=false;
  try{
    const [s1,s2]=await Promise.all([getDoc(doc(db,'users',f)),getDoc(doc(db,'users',to))]);
    if(!s2.exists())throw new Error('ไม่พบบัญชีผู้รับ');
    const b1=s1.data().bal,b2=s2.data().bal;if(b1<a)throw new Error('ยอดเงินไม่พอ');
    const id=Date.now()+'-'+Math.random().toString(36).slice(2,8),b=writeBatch(db);
    b.set(doc(db,'tx',id),{f,to,a,n,t:serverTimestamp()});
    b.update(doc(db,'users',f),{bal:b1-a,last:id});
    b.update(doc(db,'users',to),{bal:b2+a,last:id});
    if(extra)extra(b,id);
    await b.commit();ok=true;m.textContent='✅ สำเร็จ';
  }catch(e){m.textContent='❌ '+(e.message||'ผิดพลาด')}
  busy=false;return ok;
}
window.send=async()=>{
  const to=$('#to').value,a=Math.floor(+$('#amt').value),n=$('#note').value.trim(),m=$('#msg');
  if(!to||!(a>0)){m.textContent='เลือกผู้รับและใส่จำนวนให้ถูกต้อง';return}
  if(await doTransfer(curId(),to,a,n,m)){preTo=null;const x=$('#amt'),y=$('#note');if(x)x.value='';if(y)y.value=''}
};
const getItem=async id=>{const d=await getDoc(doc(db,'stock',id));return d.exists()?d.data():null};
window.tg=(id,o)=>{o?openIds.add(id):openIds.delete(id)};
window.buy=async id=>{
  const m=$('#msg'),k=Math.floor(+$('#q_'+id).value);
  if(!(k>0)||k>10000){m.textContent='ใส่จำนวนให้ถูกต้อง';return}
  const sd=await getItem(id);
  if(!sd||sd.q<k){m.textContent='ของในคลังไม่พอ (เหลือ '+(sd?sd.q:0)+')';return}
  const unit=pr(sd),total=unit*k,n=nameOf(id,sd);
  if(!confirm('ซื้อ '+n+' ×'+k+' ราคา '+fmt(unit)+'/ชิ้น รวม '+fmt(total)+' เหรียญ?'))return;
  if(await doTransfer(me.uid,'central',total,('ซื้อ: '+n+' ×'+k).slice(0,100),m,(b,tid)=>b.update(doc(db,'stock',id),{q:sd.q-k,last:tid})))alert('✅ ซื้อสำเร็จ แจ้งเจ้าของธนาคารให้ส่งของใน Minecraft');
};
window.bankBuyIn=async()=>{
  const to=$('#bp').value,id=$('#bi').value,k=Math.floor(+$('#bq').value),m=$('#msg');
  if(!to||!id||!(k>0)){m.textContent='เลือกผู้เล่น ไอเทม และใส่จำนวน';return}
  const sd=await getItem(id);
  if(!sd){m.textContent='ไม่พบไอเทมนี้ในคลัง';return}
  const unit=bankBuy(pr(sd)),total=unit*k,n=nameOf(id,sd);
  if(!confirm('รับซื้อ '+n+' ×'+k+' จ่าย '+fmt(total)+' เหรียญ ('+fmt(unit)+'/ชิ้น)?'))return;
  if(await doTransfer('central',to,total,('รับซื้อ: '+n+' ×'+k).slice(0,100),m,b=>b.update(doc(db,'stock',id),{q:sd.q+k})))alert('✅ รับซื้อแล้ว สต็อกเพิ่ม '+k);
};
const checkItem=(name,b,t,q,lo,hi,e)=>!name?'ใส่ชื่อไอเทม':!(b>=1)?'ราคากลางต้องไม่ต่ำกว่า 1':!(t>=1)?'สต็อกเป้าหมายต้องไม่ต่ำกว่า 1':!(q>=0)?'จำนวนในคลังต้องไม่ติดลบ':!(lo>0&&lo<=1)?'ราคาต่ำสุดต้องอยู่ระหว่าง 0.05–1':!(hi>=1&&hi<=20)?'ราคาสูงสุดต้องอยู่ระหว่าง 1–20':!(e>=0.1&&e<=3)?'ความไวต้องอยู่ระหว่าง 0.1–3':'';
window.initStock=async()=>{
  if(!confirm('เติมรายการสินค้าเริ่มต้น 17 อย่าง (จำนวนในคลังเริ่มที่ 0)?'))return;
  const b=writeBatch(db);PRICES.forEach(([n,base,t],i)=>b.set(doc(db,'stock',String(i)),{name:n,q:0,t,b:base,lo:0.5,hi:3,e:0.5,o:i}));
  try{await b.commit()}catch(x){alert('❌ '+x.message)}
};
window.addItem=async()=>{
  const name=$('#nn').value.trim(),b=Math.floor(+$('#nb').value),t=Math.floor(+$('#nt').value),q=Math.floor(+($('#nq').value||0)),lo=+$('#n_lo').value,hi=+$('#n_hi').value,e=+$('#n_e').value;
  const err=checkItem(name,b,t,q,lo,hi,e);if(err){alert(err);return}
  const id='i'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  try{await setDoc(doc(db,'stock',id),{name,q,t,b,lo,hi,e,o:Date.now()});alert('✅ เพิ่มไอเทมแล้ว');['nn','nb','nt','nq'].forEach(x=>{const el=$('#'+x);if(el)el.value=''})}catch(x){alert('❌ '+x.message)}
};
window.saveItem=async id=>{
  const g=k=>$('#'+id+'_'+k).value,name=g('name').trim(),q=Math.floor(+g('q')),b=Math.floor(+g('b')),t=Math.floor(+g('t')),lo=+g('lo'),hi=+g('hi'),e=+g('e');
  const err=checkItem(name,b,t,q,lo,hi,e);if(err){alert(err);return}
  const o=stock[id]&&stock[id].o!==undefined?stock[id].o:(isNaN(+id)?Date.now():+id);
  try{await setDoc(doc(db,'stock',id),{name,q,t,b,lo,hi,e,o});alert('✅ บันทึกแล้ว')}catch(x){alert('❌ '+x.message)}
};
window.delItem=async id=>{
  if(!confirm('ลบไอเทมนี้ออกจากคลัง?'))return;
  try{await deleteDoc(doc(db,'stock',id))}catch(x){alert('❌ '+x.message)}
};
window.mintMore=async()=>{
  const a=Math.floor(+$('#madd').value),n=$('#mnote').value.trim().slice(0,100),m=$('#msg')||{};
  if(!(a>0)){alert('ใส่จำนวนเหรียญ');return}
  if(!confirm('ออกเหรียญเพิ่ม '+fmt(a)+' เข้าธนาคารกลาง?')||busy)return;
  busy=true;
  try{
    const s=await getDoc(doc(db,'users','central')),id=Date.now()+'-'+Math.random().toString(36).slice(2,8),b=writeBatch(db);
    b.set(doc(db,'mints',id),{a,n,t:serverTimestamp()});
    b.update(doc(db,'users','central'),{bal:s.data().bal+a,last:id});
    await b.commit();alert('✅ ออกเหรียญเพิ่มแล้ว');
  }catch(e){alert('❌ '+(e.message||'ผิดพลาด'))}
  busy=false;
};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
